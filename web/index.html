<!DOCTYPE html>
<html>

<head>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="platform_boilerplate">
  <meta id="initial-browser-path" content="/">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="icon/icon-192x192.png">
  <link id="favicon" rel="icon" type="image/x-icon" href="favicon.ico">
  <title>Platform Boilerplate</title>
  <link rel="manifest" href="manifest.json">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <style>
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
    }

    #splash-mark {
      width: 42px;
      height: 42px;
      border: 4px solid #007d8a;
      border-right-color: transparent;
      border-radius: 50%;
      animation: splash-spin 0.9s linear infinite;
    }

    @keyframes splash-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <script>
    // Flutter's web engine can normalize location before Dart reads it.
    document.getElementById('initial-browser-path').setAttribute(
      'content',
      window.location.pathname + window.location.search + window.location.hash,
    );
  </script>

<script>
  window.addEventListener('DOMContentLoaded', (event) => {
    const brandingCacheKey = 'tenantBrandingData';
    let isBrandingDispatched = false;

    const applyBranding = (branding) => {
      if (isBrandingDispatched && branding) {
      } else {
        window.dispatchEvent(new CustomEvent('brandingReady', { detail: branding }));
        isBrandingDispatched = true;
      }
      
      if (!branding) return;

      document.title = branding.name || document.title;
      const backgroundColor =
        branding.theme_data_settings?.primary_seed_color ??
        branding.theme_data_settings?.light_scheme_data?.primary_seed_color;
      
      if (backgroundColor) {
        const splashScreen = document.getElementById('splash-screen');
        if (splashScreen) {
          splashScreen.style.backgroundColor = backgroundColor;
        }
      }
    };

    let cachedDataString = null;
    try {
      cachedDataString = localStorage.getItem(brandingCacheKey);
      if (cachedDataString) {
        const cachedBranding = JSON.parse(cachedDataString);
        console.log('Branding loaded from cache.');
        applyBranding(cachedBranding);
      }
    } catch (error) {
      console.error('Failed to parse cached branding data.', error);
      localStorage.removeItem(brandingCacheKey);
    }

    (async function () {
      try {
        const response = await fetch('/api/v1/environment');
        if (response.ok) {
          const freshBranding = await response.json();
          const freshBrandingString = JSON.stringify(freshBranding);

          if (freshBrandingString !== cachedDataString) {
            applyBranding(freshBranding);
            localStorage.setItem(brandingCacheKey, freshBrandingString);
          }
        } else {
          console.warn('Branding API returned an error. Using cached or default state.');
        }
      } catch (error) {
        console.error("Network failure when fetching branding.", error);
      } finally {
        if (!isBrandingDispatched) {
          applyBranding(null);
        }
      }
    })();
  });
</script>
</head>

<body>
  <div id="splash-screen" class="splash">
    <div id="splash-mark" role="status" aria-label="Loading application"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
